<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Apply Wizz — OneClick 47-Screen Review</title>
<style>
:root{--ink:#1E1E1E;--green:#29FE29;--blue:#2C76FF;--soft:#F5F5F5;--tint:#EFFBFF;--navy:#0B1D33;--yellow:#FFDE59;--coral:#FF5C5C;--line:#E6EAF0;--muted:#667085;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#F7F9FC;color:var(--ink)}button,input{font:inherit}.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;height:64px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}.logo{display:flex;align-items:center;gap:9px;font-weight:900}.mark{width:36px;height:36px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px}.counter{font-size:12px;font-weight:800;color:var(--blue);background:var(--tint);padding:7px 10px;border-radius:999px}.wrap{width:min(100% - 28px,760px);margin:auto;padding:28px 0 112px}.eyebrow{display:inline-flex;padding:7px 10px;border-radius:999px;background:var(--tint);color:#185BCC;font-size:11px;font-weight:900;letter-spacing:.06em}.title{font-size:32px;line-height:1.08;letter-spacing:-.035em;margin:14px 0 10px}.desc{color:var(--muted);line-height:1.65;font-size:14px;margin:0 0 20px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 8px 28px rgba(20,35,55,.04);margin:14px 0}.card.dark{background:var(--navy);color:#fff;border-color:var(--navy)}.card.blue{background:var(--tint);border-color:#D7ECFF}.card.green{background:#E9FFE9;border-color:#CFF8CF}.card.yellow{background:#FFF9D9;border-color:#F8E9A1}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.metric strong{display:block;font-size:25px}.metric small{color:var(--muted)}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900;text-transform:uppercase}.pill.green{background:#E9FFE9;color:#0B6B22}.pill.yellow{background:#FFF2B8;color:#735E00}.pill.blue{background:var(--tint);color:#185BCC}.check{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #EEF1F4;font-size:14px}.check:last-child{border-bottom:0}.ok{color:#0B6B22;font-weight:900}.warn{color:#A15C00;font-weight:900}.btn{min-height:48px;border:0;border-radius:16px;padding:12px 16px;font-weight:900;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.dark{background:var(--navy);color:#fff}.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.full{width:100%}.footer{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.footer .btn{min-height:46px;font-size:12px}.navshade{display:none;position:fixed;inset:0;z-index:50;background:rgba(11,29,51,.58);backdrop-filter:blur(5px);padding:12px;overflow:auto}.navshade.open{display:block}.panel{max-width:760px;margin:0 auto;background:#fff;border-radius:28px;padding:18px}.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.jump{border:1px solid var(--line);background:#fff;border-radius:16px;padding:11px;text-align:left;font-size:12px;font-weight:800}.jump.on{border-color:var(--blue);background:var(--tint);color:#185BCC}.browser{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff}.browserbar{padding:10px;background:#F1F3F6;font-size:11px;color:#8A93A3}.browserbody{padding:30px;text-align:center;background:#FAFBFC}.progress{height:9px;border-radius:99px;background:#E9EDF2;overflow:hidden}.progress span{display:block;height:100%;border-radius:99px;background:var(--blue)}.timeline{border-left:2px solid #E9EDF2;margin-left:8px;padding-left:20px}.event{position:relative;padding:0 0 18px}.event:before{content:"";position:absolute;left:-27px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid #fff}.event b{display:block;font-size:14px}.event small{color:var(--muted)}@media(min-width:800px){.wrap{padding-top:44px}.title{font-size:42px}.navgrid{grid-template-columns:repeat(3,1fr)}.footer{left:50%;transform:translateX(-50%);width:760px;border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo"><div class="mark">AW</div>APPLY WIZZ</div><div id="counter" class="counter">01 / 47</div></header>
<main id="screen" class="wrap"></main>
<div class="footer"><button class="btn secondary" onclick="prev()">← Previous</button><button class="btn secondary" onclick="toggleNav()">All 47</button><button class="btn primary" onclick="next()">Next →</button></div>
<div id="navshade" class="navshade"><div class="panel"><div class="row"><div><b>OneClick screen review</b><div style="font-size:12px;color:var(--muted);margin-top:4px">Jump to any screen while reviewing on mobile.</div></div><button class="btn secondary" onclick="toggleNav()">Close</button></div><div id="navgrid" class="navgrid"></div></div></div>
</div>
<script>
const screens=[
['01','YOUR CAREER PARTNER','Welcome','Apply to jobs without filling the same forms again and again.','Account → Career Passport → OneClick Agent'],
['02','ACCOUNT','Create your account','Start with a secure Apply Wizz account. Google login and Gmail permission stay separate.','Google · Apple · Email · Phone'],
['03','SECURITY','Verify your account','Secure the Career Passport and high-priority application alerts.','Email verification · Phone verification'],
['04','CAREER PASSPORT','Build your Career Passport','Choose the fastest way to give OneClick trusted career information.','Upload Resume · Import Professional Profile · Build From Scratch'],
['05','CAREER PASSPORT','Upload your resume','Use a PDF or DOCX to build most of the Career Passport automatically.','PDF · DOCX · Build My Passport'],
['06','AI EXTRACTION','Building your Career Passport','Show visible extraction work instead of a generic spinner.','Personal info ✓ · Education ✓ · Experience ✓ · Skills ✓ · Projects ✓ · Certifications ✓'],
['07','REVIEW','Review what we found','Nothing becomes trusted Career Passport data until the candidate can review it.','Personal Information · Education · Experience · Skills · Projects'],
['08','GAP ANALYSIS','We need a few more things','Explain the durable facts a resume cannot reliably provide.','21 details ready · 6 still needed'],
['09','CAREER PASSPORT','Work authorization','Collect work authorization and sponsorship without guessing.','Authorized to work? · Sponsorship now/future?'],
['10','CAREER PASSPORT','Job preferences','Help OneClick understand what is worth applying to.','Roles · Employment type · Locations · Work style · Start date · Compensation'],
['11','ANSWER MEMORY','Teach OneClick once','Save common confirmed answers so candidates never re-enter them unnecessarily.','18+ · Relocation · Onsite · Start date · Salary · Notice period'],
['12','TRUST','Some answers always stay yours','Sensitive employer questions always require explicit candidate judgment.','Veteran status · Disability · Demographics · Criminal history · Legal attestations'],
['13','CAREER PASSPORT','Career Passport ready','Turn one-time setup into a reusable professional identity.','92% ready · Profile ✓ · Resume ✓ · Answers ✓'],
['14','ONECLICK AGENT','Activate your Application Agent','Career Passport becomes action through the private browser and job-search email.','Career Passport Ready · Browser Setup · Email Connect'],
['15','PRIVATE BROWSER','Your private application browser','A secure candidate-specific browser keeps employer application sessions available.','Session continuity · Background progress · Human handoff'],
['16','PRIVATE BROWSER','Browser ready','Confirm the candidate application browser is active.','Private Application Browser · Active'],
['17','EMAIL CONNECTION','Let OneClick handle application verification','Connect job-search Gmail for relevant verification and application activity.','Can detect verification · Cannot send/delete/edit email'],
['18','GOOGLE','You’re continuing to Google','Google owns the permission experience; Apply Wizz never asks for a Google password.','Choose account · Google consent'],
['19','EMAIL CONNECTION','Job-search email connected','Confirm the mailbox OneClick can use for relevant application verification.','r••••••@gmail.com · Connected'],
['20','NOTIFICATIONS','Stay reachable when OneClick needs you','Use push first and SMS fallback only for meaningful interruptions.','Push recommended · SMS fallback · Low-priority activity stays in app'],
['21','ACTIVATED','Your Application Agent is ready','From now on, approve a job and OneClick handles everything it safely can.','Career Passport ✓ · Browser ✓ · Email ✓ · Notifications ✓'],
['22','ONECLICK ACTIVE','Home','Start with what needs attention—not a giant job feed.','NVIDIA verification · Amazon one answer · Strong Matches · In Progress · Submitted'],
['23','JOB INTELLIGENCE','Jobs worth your time','Show fit and application readiness as two different ideas.','Microsoft 93% / 8·10 · Google 95% / 10·10 · NVIDIA 92% / 9·10 · Amazon 88% / 9·10'],
['24','MICROSOFT','Software Engineer','Explain job fit and readiness before asking for application authorization.','Redmond, WA · $140K–$175K · 93% Match · 8/10 Ready'],
['25','PREPARING','Checking the Microsoft application','Inspect required fields, documents, questions, login, and verification first.','10 questions found · 8 ready · 2 answers needed'],
['26','2 ANSWERS','Two answers needed','Ask only what OneClick genuinely does not know.','Relocate to Seattle? · Earliest available start date · Remember answers'],
['27','CONFIRM','Quick confirmation','Confirm a partially uncertain known fact without forcing full re-entry.','Relocation = Yes · Microsoft asks specifically about Seattle'],
['28','10/10 READY','Ready for OneClick','The final authorization moment. One click means permission to complete and submit this application.','93% Match · 10/10 Ready · Resume ✓ · Browser ✓ · Email verification ✓'],
['29','APPLICATION IN PROGRESS','OneClick is applying','The candidate can leave this screen while the agent continues.','Opened ✓ · Profile ✓ · Resume ✓ · Questions ● · Verification ○ · Submit ○'],
['30','ACTION NEEDED','OneClick needs one answer','Ask one genuinely unknown factual employer question, then resume immediately.','Non-compete agreement? · Yes · No · Unsure'],
['31','SENSITIVE QUESTION','Your decision is required','Sensitive answers are never selected by the agent.','Disability self-identification · Candidate chooses'],
['32','HUMAN STEP','Microsoft needs human verification','Pause safely at genuine human verification and request a short handoff.','Usually under 1 minute · Complete Verification'],
['33','PRIVATE BROWSER','Secure Application Session','Temporarily give the candidate control of the private browser.','Employer verification area · Done → Resume OneClick'],
['34','SIGN IN','Microsoft needs you to sign in once','Employer credentials are entered only inside the secure employer session.','Sign In Securely · Session saved'],
['35','RECOVERY','We couldn’t finish this application','Explain recoverable failures in consumer language.','Employer site changed · Data saved · Not submitted · Retry'],
['36','SUBMITTED','Application submitted','Celebrate the result and quantify the busywork OneClick completed.','10 questions · 1 resume · 1 email verification · 0 interruptions'],
['37','APPLICATIONS','Your applications','Track all application states in one place.','All · Needs Attention · Applying · Submitted · Interviews · Offers · Closed'],
['38','MICROSOFT','Application Timeline','Show exactly what the agent did and when.','11:36 approved · 11:37 opened · 11:38 passport · 11:39 resume · 11:40 questions · 11:41 verification · 11:42 submitted'],
['39','ATTENTION CENTER','Needs your attention','Aggregate only outstanding human-required work.','NVIDIA verification · Amazon one question · Meta login expired'],
['40','CAREER PASSPORT','Ramakrishna Chanda','Manage the durable identity OneClick reuses across applications.','96% complete · Personal · Education · Experience · Skills · Work Auth · Preferences · Answers · Documents'],
['41','ANSWER MEMORY','What OneClick remembers','Make reusable semantic answers transparent and editable.','Relocation Yes · Start June 15, 2027 · Sponsorship Yes · Compensation $140K+'],
['42','CHANGE PROTECTION','This answer changed','Important changes affect future applications only.','Sponsorship: No → Yes · Previously used in 6 applications'],
['43','DOCUMENTS','Application documents','Manage role-specific resumes and supporting files.','Primary Resume · ML Resume · Cover Letter · Transcript · Portfolio'],
['44','CONNECTIONS','Connected services','Control the infrastructure OneClick can use for approved applications.','Application Browser Active · Gmail Connected · Phone Verified · Push Active'],
['45','SECURITY & PRIVACY','Security you can understand','Give candidates direct control of sessions, permissions, devices, and data.','Reset Browser · Disconnect Gmail · Sign Out Devices · Export Passport · Delete Account'],
['46','PROFILE','Profile','One place for personal settings and account controls.','Career Passport · Connections · Notifications · Membership · Support · Security · Privacy'],
['47','MEMBERSHIP','OneClick Membership','Show what the $89.99/month agent actually saved the candidate from doing.','38 applications · 327 questions · 11 verifications · 4 interruptions · 9h 45m saved']
];
let i=0;
const special={
'04':()=>`<div class="stack"><div class="card blue"><div class="row"><div><b>Upload Resume</b><div class="desc" style="margin:5px 0 0">Recommended · about 2 minutes</div></div><span class="pill green">Recommended</span></div><button class="btn primary full" style="margin-top:14px">Upload Resume</button></div><div class="card"><b>Import Professional Profile</b><div class="desc" style="margin:7px 0 0">Bring in existing LinkedIn-style professional information.</div></div><div class="card"><b>Build From Scratch</b><div class="desc" style="margin:7px 0 0">Guided manual Career Passport setup.</div></div></div>`,
'22':()=>`<div class="card dark"><div class="row"><div><span class="pill green">● Agent Active</span><h2 style="margin:12px 0 4px">Good evening, Ramakrishna</h2></div></div></div><div class="card yellow"><b>Needs Your Attention</b><div class="check"><span>⚠️</span><div><b>NVIDIA · Human verification</b><div style="color:var(--muted);font-size:12px">Usually under 1 minute</div></div></div><div class="check"><span>✨</span><div><b>Amazon · One new question</b><div style="color:var(--muted);font-size:12px">About 10 seconds</div></div></div></div><div class="grid2"><div class="metric"><strong>93%</strong><small>Microsoft Match</small></div><div class="metric"><strong>95%</strong><small>Google Match</small></div></div>`,
'24':()=>`<div class="card"><span class="pill blue">Microsoft</span><h2 style="margin:12px 0 4px">Software Engineer</h2><div class="desc">Redmond, WA · $140K–$175K</div><div class="grid2"><div class="metric"><strong style="color:#185BCC">93%</strong><small>Job Match</small></div><div class="metric"><strong>8/10</strong><small>Application Readiness</small></div></div><button class="btn primary full" style="margin-top:16px">Prepare Application</button></div>`,
'28':()=>`<div class="card"><div class="row"><div><span class="pill blue">Microsoft</span><h2>Software Engineer</h2></div><div style="text-align:right"><b style="font-size:28px;color:#185BCC">93%</b><div style="font-size:11px;color:var(--muted)">Match</div></div></div><div class="card green"><b style="font-size:22px;color:#0B6B22">10/10 Ready</b><div class="progress" style="margin-top:10px"><span style="width:100%;background:var(--green)"></span></div></div>${['Resume selected','10/10 application answers','Career Passport','Application Browser','Email verification'].map(x=>`<div class="check"><span class="ok">✓</span><div>${x}</div></div>`).join('')}<button class="btn dark full" style="margin-top:16px">Apply with OneClick</button></div>`,
'29':()=>`<div class="card"><div class="row"><div><b>Microsoft · Software Engineer</b><div style="font-size:12px;color:var(--muted);margin-top:4px">Application in progress</div></div><span class="pill blue">Running</span></div><div class="progress" style="margin:18px 0"><span style="width:68%"></span></div>${[['Application opened','Done'],['Profile information added','Done'],['Resume uploaded','Done'],['Questions','Completing'],['Verification','Waiting'],['Submission','Waiting']].map(([a,b],n)=>`<div class="check"><span class="${n<3?'ok':'warn'}">${n<3?'✓':'○'}</span><div style="flex:1">${a}</div><b>${b}</b></div>`).join('')}</div><div class="card dark">You can leave this screen. OneClick will notify you only if something genuinely needs your attention.</div>`,
'33':()=>`<div class="browser"><div class="browserbar">careers.microsoft.com/application/verify</div><div class="browserbody"><div style="font-size:32px">🔒</div><h3>Employer human-verification area</h3><div class="desc">You temporarily control your private application browser. Complete the human step, then return control to OneClick.</div><button class="btn primary">Done — Resume OneClick</button></div></div>`,
'36':()=>`<div class="card green" style="text-align:center"><div style="width:72px;height:72px;border-radius:24px;background:var(--green);display:grid;place-items:center;margin:auto;font-size:32px">✓</div><h2>Application submitted</h2><div class="desc">Microsoft · Software Engineer · 11:42 PM</div></div><div class="grid2"><div class="metric"><strong>10</strong><small>questions completed</small></div><div class="metric"><strong>1</strong><small>resume uploaded</small></div><div class="metric"><strong>1</strong><small>email verification</small></div><div class="metric"><strong>0</strong><small>interruptions</small></div></div>`,
'38':()=>`<div class="card"><div class="timeline">${[['11:36 PM','Application approved'],['11:37 PM','Employer application opened'],['11:38 PM','Career Passport added'],['11:39 PM','Resume uploaded'],['11:40 PM','10 questions completed'],['11:41 PM','Email verification completed'],['11:42 PM','Application submitted']].map(([t,a])=>`<div class="event"><small>${t}</small><b>${a}</b></div>`).join('')}</div></div>`,
'47':()=>`<div class="card dark"><div class="row"><div><span class="pill green">OneClick Membership</span><h2 style="margin:12px 0 4px">$89.99 / month</h2><div style="color:#C6D0DE;font-size:13px">This month</div></div></div></div><div class="grid2"><div class="metric"><strong>38</strong><small>applications completed</small></div><div class="metric"><strong>327</strong><small>questions automated</small></div><div class="metric"><strong>11</strong><small>verification steps</small></div><div class="metric"><strong>4</strong><small>candidate interruptions</small></div></div><div class="card blue"><b style="font-size:24px">9h 45m</b><div class="desc" style="margin:5px 0 0">Estimated application time saved this month</div></div>`
};
function generic(s){const parts=s[4].split(' · ');return `<div class="card"><div class="stack">${parts.map((x,n)=>`<div class="check"><span class="${n<2?'ok':''}">${n<2?'✓':'•'}</span><div>${x}</div></div>`).join('')}</div></div><div class="card blue"><b>Product rule</b><div class="desc" style="margin:6px 0 0">Before Apply, OneClick removes uncertainty. After Apply, OneClick removes work.</div></div>`}
function render(){const s=screens[i];document.getElementById('counter').textContent=`${s[0]} / 47`;document.getElementById('screen').innerHTML=`<span class="eyebrow">${s[1]}</span><h1 class="title">${s[2]}</h1><p class="desc">${s[3]}</p>${special[s[0]]?special[s[0]]():generic(s)}`;document.getElementById('navgrid').innerHTML=screens.map((x,n)=>`<button class="jump ${n===i?'on':''}" onclick="go(${n})"><span style="color:var(--blue)">${x[0]}</span><br>${x[2]}</button>`).join('');window.scrollTo({top:0,behavior:'instant'})}
function next(){i=Math.min(46,i+1);render()}function prev(){i=Math.max(0,i-1);render()}function go(n){i=n;toggleNav(false);render()}function toggleNav(force){const el=document.getElementById('navshade');if(force===false)el.classList.remove('open');else el.classList.toggle('open')}render();
</script>
</body>
</html>
